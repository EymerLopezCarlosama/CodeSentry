<!doctype html>
<html lang="es">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeSentry · Centro de arranque</title>
<link rel="stylesheet" href="index.css">
</head>
<body>
<div class="brillo"></div>
<main class="card">

  </svg>
  <h1>CodeSentry</h1>
  <p class="sub">Centro de arranque · todo corre en este equipo</p>
  <section id="req"></section>
  <ul id="lista"></ul>
  <p id="mensaje"></p>
  <button id="encender" class="boton grande">Encender todo</button>
  <div class="acciones">
    <button id="entrar" class="boton" disabled>Entrar a CodeSentry</button>
    <button id="apagar" class="boton sec">Apagar todo</button>

<dialog id="dlg"></dialog>

<script src="app.js"></script>
